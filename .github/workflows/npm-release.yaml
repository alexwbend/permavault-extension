name: Retired npm publication

# This application is distributed as a browser extension, not an npm package.
# No release event or manual invocation publishes anything from this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain supported release
        run: echo "Automatic npm publication is retired. Build Extension produces a reviewable artifact; store submission is separate."
