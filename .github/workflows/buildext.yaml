name: Build Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Check capture flow
        run: node --test tests/*.test.cjs
      - name: Check TypeScript
        run: yarn run tsc --noEmit
      - name: Build extension
        run: yarn build
      - name: Package extension
        run: cd dist/ext && zip -r ../../permavault-extension.zip .
      - name: Save reviewable extension package
        uses: actions/upload-artifact@v4
        with:
          name: permavault-extension-${{ github.sha }}
          path: permavault-extension.zip
          if-no-files-found: error
          retention-days: 14
# Store submission is a separate release action. This workflow never uploads
# to a Chrome Web Store account or publishes a GitHub/npm release.
